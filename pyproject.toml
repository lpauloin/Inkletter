[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inkletter"
version = "1.1.0"
description = "Markdown to MJML/HTML converter and previewer"
authors = [
    { name = "Laurent Pauloin", email = "laurent@crococode.co" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click==8.4.2",
    "jinja2==3.1.6",
    "mistune==3.3.4",
    "mjml-python==1.4.1",
    "tomli==2.2.1; python_version < '3.11'"
]

[tool.black]
# The output only has to run on the oldest Python we support: listing
# the newer ones adds nothing, and made Black format for a version the
# interpreter running it could not parse back for its safety check.
target-version = ["py310"]
line-length = 100

[project.scripts]
inkletter = "inkletter.cli:cli"

[project.urls]
Homepage = "https://github.com/lpauloin/Inkletter"
Repository = "https://github.com/lpauloin/Inkletter"
Issues = "https://github.com/lpauloin/Inkletter/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["inkletter*"]

[tool.setuptools.package-data]
inkletter = ["templates/**/*.html"]