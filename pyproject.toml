[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inkletter"
version = "3.1.0"
description = "Markdown to MJML/HTML converter and previewer"
authors = [
    { name = "Laurent Pauloin", email = "laurent.pauloin@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "mistune>=3.3.4,<4",
    "mjml-python>=1.4,<2",
    "tomli>=2.0; python_version < '3.11'"
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
# The published package must run on the oldest Python we support, so lint
# and format against that floor rather than against whichever interpreter
# happens to run the tools.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Every visitor opens with `from inkletter.ast import *`, and that is
    # the point: a visitor names the node types it handles and nothing
    # else, so the file reads as a list of cases rather than as an import
    # block. Flagging each of the 350-odd uses says nothing new.
    "F403",
    "F405",
    # The formatter owns line length, and it splits what can be split.
    # What is left is comments and URLs it cannot break — exactly what
    # Black left long before this migration.
    "E501",
]

[project.scripts]
inkletter = "inkletter.cli:cli"

[project.urls]
Homepage = "https://github.com/lpauloin/Inkletter"
Repository = "https://github.com/lpauloin/Inkletter"
Issues = "https://github.com/lpauloin/Inkletter/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["inkletter*"]

[tool.setuptools.package-data]
inkletter = ["templates/**/*.html"]
